<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <title>TAC - Workspace</title>
    <link
      rel="icon"
      href="assets/icons/home/TAC-favicon.png"
      type="image/png"
    />
  </head>
  <body>
    <div class="pageTop">
      <button type="button" class="userWorkSpace">
        <img
          src="assets/icons/dashboard/user.png"
          alt="userImg"
          width="20px"
          class="userImg"
        />
        <span class="userName">User's WorkSpace</span>
        <img
          src="assets/icons/dashboard/setaExpandir.png"
          alt="setaExpandir"
          width="14px"
          class="setaExpandir"
        />
      </button>

      <div class="searchBarrAll">
        <input type="text" placeholder="Search" class="searchBarr" />
        <img
          src="assets/icons/dashboard/lupa.png"
          alt="lupa"
          width="14px"
          class="lupa"
        />
      </div>
    </div>

    <div class="mainLayout">
      <aside class="navbar">
        <button type="button" class="openSidebar">+</button>
        <button type="button" class="startButton">
          <img
            class="startButtonImage"
            src="assets/icons/dashboard/start-clicked.png"
            alt="start"
            width="23px"
          /></button
        ><button type="button" class="plannerButton">
          <img
            class="plannerButtonImage"
            src="assets/icons/dashboard/planner.png"
            alt="planner"
            width="23px"
          />
        </button>
      </aside>
      <aside class="sidebar">Feature!</aside>
      <section class="workspaceAll defocus" id="workspaceAll">
        <div class="spaceWorkTop">
          <button type="button" class="spaceWorkTitle">
            <img
              src="assets/icons/dashboard/workspace.png"
              alt="workspaceIcon"
              width="19px"
              class="workspaceIcon"
            />
            <span>Team Space</span>
            <img
              src="assets/icons/dashboard/setaExpandir.png"
              alt="setaExpandir"
              width="14px"
              class="setaExpandir"
            />
          </button>

          <div class="canal">
            <button type="button" class="overview">
              <img
                src="assets/icons/dashboard/overView.png"
                class="overViewImg"
                width="14px"
              />
              <span>Overview</span>
            </button>
            <button type="button" class="topList">
              <img
                src="assets/icons/dashboard/list.png"
                class="listImg"
                width="14px"
              />
              <span>List</span>
            </button>
            <button type="button" class="calendar">
              <img
                src="assets/icons/dashboard/calendar.png"
                class="calendarImg"
                width="13px"
              />
              <span>Calendar</span>
            </button>
            <button type="button" class="board">
              <img
                src="assets/icons/dashboard/board.png"
                class="boardImg"
                width="14px"
              />
              <span>Board</span>
            </button>
            <button type="button" class="gantt">
              <img
                src="assets/icons/dashboard/gantt.png"
                class="ganttImg"
                width="14px"
              />
              <span>Gantt</span>
            </button>
            <button type="button" class="table">
              <img
                src="assets/icons/dashboard/table.png"
                class="tableImg"
                width="14px"
              />
              <span>Table</span>
            </button>
          </div>
        </div>

        <div class="spaceWork">
          <div class="addCardAndFilters">
            <button type="button" class="filtersContainer">
              <img
                src="assets/icons/dashboard/filter.png"
                class="filterImg"
                alt="filterImg"
                width="16px"
                height="16px"
              />
              <span>Filters</span>
            </button>
            <button type="button" class="addCard">Add card</button>
          </div>
          <div class="cardContainer"></div>
        </div>
      </section>
      <section class="plannerAll" id="plannerAll">
        <section class="plannerIntroducePage">
          <h1 class="plannerH1">
            Plan your week, organize appointments, and stay on track.
          </h1>
          <p class="plannerP">
            A simple space to organize your daily plans, write notes, and keep
            track of your important events throughout the week.
          </p>
          <button type="button" class="openPlanner">Plan My Week</button>
        </section>
        <section class="plannerContent">
          <div class="plannerTop">
            <button class="plannerTopLeftButton">
              <p class="weeklyPlannerH1">Weekly Planner</p>
              <img
                class="weeklyPlannerImage"
                src="assets/icons/dashboard/setaExpandir.png"
                alt="expand arrow"
                width="13"
              />
            </button>
            <button class="day">Today</button>
            <div class="weekChangerContainer">
              <button class="changer" id="leftChanger"><</button>
              <button class="changer" id="rigthChanger">></button>
              <button class="plannerDate">July 21-27</button>
              <button class="changer" id="opener">
                <img
                  src="assets/icons/dashboard/setaExpandir.png"
                  alt="expand arrow"
                  width="15"
                />
              </button>
            </div>
            <div class="weekly-mouthly">
              <button class="weeklyButton">
                <p>Weekly</p>
                <img
                  src="assets/icons/dashboard/weekly.png"
                  alt="weekly image"
                  width="17"
                />
              </button>
              <button class="monthlyButton">
                <p>Monthly</p>
                <img
                  src="assets/icons/dashboard/monthly.png"
                  alt="monthly image"
                  width="18"
                />
              </button>
              <button class="listButton">
                <p>List</p>
                <img
                  src="assets/icons/dashboard/list-planner.png"
                  alt="list"
                  width="20"
                />
              </button>
            </div>
            <button class="plannerButtons" id="darkMode">
              <img
                src="assets/icons/dashboard/half-moon.png"
                alt="darkMode"
                width="18"
              />
            </button>
            <button class="plannerButtons" id="more">
              <img
                src="assets/icons/dashboard/more.png"
                alt="more"
                width="15"
              />
            </button>
            <button class="plannerButtons" id="notification">
              <img
                src="assets/icons/dashboard/notification.png"
                alt="nottification"
                width="20"
              />
            </button>
          </div>
          <div class="plannerContentElements">
            <section class="weeklyPlanner">
              <div class="weekday">
                <div>
                  <p>MON</p>
                  <p>21</p>
                </div>
                <div>
                  <p>TUE</p>
                  <p>22</p>
                </div>
                <div>
                  <p>WED</p>
                  <p>23</p>
                </div>
                <div>
                  <p>THU</p>
                  <p>24</p>
                </div>
                <div>
                  <p>FRI</p>
                  <p>25</p>
                </div>
                <div>
                  <p>SAT</p>
                  <p>26</p>
                </div>
                <div>
                  <p>SUN</p>
                  <p>27</p>
                </div>
              </div>
              <div class="dailyBoxs">
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
              </div>
              <div class="plannerUtilities"></div>
            </section>
            <section class="monthlyPlanner"></section>
          </div>
        </section>
      </section>
    </div>
    <script type="module" src="js/dashboard-js/controller.js"></script>
    <script type="module" src="js/dashboard-js/main.js"></script>
  </body>
</html>
